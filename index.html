<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Horas V2</title>
</head>
<body>

<h1>Controle de Horas V2</h1>

<p><strong>Saldo geral:</strong> <span id="saldoGeral">+00:00</span></p>

<button onclick="baterPontoAutomatico()">Bater ponto agora</button>
<button onclick="adicionarDia()">Adicionar dia</button>
<button onclick="exportarCSV()">Exportar CSV</button>
<button onclick="limparTudo()">Limpar tudo</button>

<table border="1" cellpadding="8" style="margin-top:15px; border-collapse:collapse; width:100%;">
<thead>
<tr>
<th>Data</th>
<th>Entrada</th>
<th>Saída almoço</th>
<th>Retorno almoço</th>
<th>Saída final</th>
<th>Horas</th>
<th>Saldo</th>
<th>Obs</th>
<th>Ação</th>
</tr>
</thead>
<tbody id="tabela"></tbody>
</table>

<script>
const JORNADA_PADRAO = 480;
const TOLERANCIA = 10;
const LIMITE_CREDITO_DIA = 60;
const STORAGE_KEY = "controle_horas_v2";

let registros = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

function salvarDados() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(registros));
}

function hojeISO() {
  return new Date().toISOString().slice(0, 10);
}

function horaAtualHHMM() {
  const agora = new Date();
  return String(agora.getHours()).padStart(2, "0") + ":" + String(agora.getMinutes()).padStart(2, "0");
}

function novoRegistro(data = hojeISO()) {
  return {
    id: crypto.randomUUID(),
    data: data,
    entrada: "",
    saidaAlmoco: "",
    retornoAlmoco: "",
    saidaFinal: "",
    obs: ""
  };
}

function paraMinutos(hora) {
  if (!hora) return null;
  const partes = hora.split(":").map(Number);
  return partes[0] * 60 + partes[1];
}

function calcularHorasDia(reg) {
  const entrada = paraMinutos(reg.entrada);
  const saidaAlmoco = paraMinutos(reg.saidaAlmoco);
  const retornoAlmoco = paraMinutos(reg.retornoAlmoco);
  const saidaFinal = paraMinutos(reg.saidaFinal);

  if ([entrada, saidaAlmoco, retornoAlmoco, saidaFinal].some(v => v === null)) return null;

  const manha = saidaAlmoco - entrada;
  const tarde = saidaFinal - retornoAlmoco;

  if (manha < 0 || tarde < 0) return null;

  return manha + tarde;
}

function calcularSaldoDia(horasDia) {
  if (horasDia === null) return null;

  const diff = horasDia - JORNADA_PADRAO;

  if (Math.abs(diff) <= TOLERANCIA) return 0;
  if (diff > 0) return Math.min(diff, LIMITE_CREDITO_DIA);

  return diff;
}

function formatarHHMM(minutos) {
  if (minutos === null) return "—";
  const abs = Math.abs(minutos);
  const h = Math.floor(abs / 60);
  const m = abs % 60;
  return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
}

function formatarSaldo(minutos) {
  if (minutos === null) return "—";
  return (minutos < 0 ? "-" : "+") + formatarHHMM(minutos);
}

function adicionarDia() {
  registros.push(novoRegistro());
  salvarDados();
  renderizar();
}

function removerDia(id) {
  registros = registros.filter(reg => reg.id !== id);
  salvarDados();
  renderizar();
}

function limparTudo() {
  if (!confirm("Tem certeza que deseja apagar todos os registros?")) return;
  registros = [];
  salvarDados();
  renderizar();
}

function atualizarCampo(id, campo, valor) {
  registros = registros.map(reg => reg.id === id ? { ...reg, [campo]: valor } : reg);
  salvarDados();
  renderizar();
}

function baterPontoAutomatico() {
  const dataHoje = hojeISO();
  let reg = registros.find(r => r.data === dataHoje);

  if (!reg) {
    reg = novoRegistro(dataHoje);
    registros.push(reg);
  }

  const hora = horaAtualHHMM();

  if (!reg.entrada) reg.entrada = hora;
  else if (!reg.saidaAlmoco) reg.saidaAlmoco = hora;
  else if (!reg.retornoAlmoco) reg.retornoAlmoco = hora;
  else if (!reg.saidaFinal) reg.saidaFinal = hora;
  else alert("As 4 batidas de hoje já foram preenchidas.");

  salvarDados();
  renderizar();
}

function renderizar() {
  registros.sort((a,b) => new Date(a.data) - new Date(b.data));

  const tabela = document.getElementById("tabela");
  tabela.innerHTML = "";

  let saldoGeral = 0;

  registros.forEach(reg => {
    const horasDia = calcularHorasDia(reg);
    const saldoDia = calcularSaldoDia(horasDia);

    if (saldoDia !== null) saldoGeral += saldoDia;

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td><input type="date" value="${reg.data}" onchange="atualizarCampo('${reg.id}', 'data', this.value)"></td>
      <td><input type="time" value="${reg.entrada}" onchange="atualizarCampo('${reg.id}', 'entrada', this.value)"></td>
      <td><input type="time" value="${reg.saidaAlmoco}" onchange="atualizarCampo('${reg.id}', 'saidaAlmoco', this.value)"></td>
      <td><input type="time" value="${reg.retornoAlmoco}" onchange="atualizarCampo('${reg.id}', 'retornoAlmoco', this.value)"></td>
      <td><input type="time" value="${reg.saidaFinal}" onchange="atualizarCampo('${reg.id}', 'saidaFinal', this.value)"></td>
      <td>${horasDia === null ? "—" : formatarHHMM(horasDia)}</td>
      <td>${saldoDia === null ? "—" : formatarSaldo(saldoDia)}</td>
      <td><input type="text" value="${reg.obs || ""}" onchange="atualizarCampo('${reg.id}', 'obs', this.value)"></td>
      <td><button onclick="removerDia('${reg.id}')">Excluir</button></td>
    `;

    tabela.appendChild(tr);
  });

  document.getElementById("saldoGeral").innerText = formatarSaldo(saldoGeral);
}

function exportarCSV() {
  const linhas = [["Data","Entrada","Saida Almoco","Retorno Almoco","Saida Final","Horas Dia","Saldo Dia","Observacao"]];

  registros.forEach(reg => {
    const horasDia = calcularHorasDia(reg);
    const saldoDia = calcularSaldoDia(horasDia);

    linhas.push([
      reg.data,
      reg.entrada,
      reg.saidaAlmoco,
      reg.retornoAlmoco,
      reg.saidaFinal,
      horasDia === null ? "" : formatarHHMM(horasDia),
      saldoDia === null ? "" : formatarSaldo(saldoDia),
      (reg.obs || "").replaceAll(";", ",")
    ]);
  });

  const csv = linhas.map(linha => linha.join(";")).join("\\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "controle_horas_v2.csv";
  a.click();

  URL.revokeObjectURL(url);
}

if (registros.length === 0) {
  registros.push({
    id: crypto.randomUUID(),
    data: hojeISO(),
    entrada: "07:30",
    saidaAlmoco: "11:30",
    retornoAlmoco: "12:30",
    saidaFinal: "17:30",
    obs: "Modelo padrão"
  });
  salvarDados();
}

renderizar();
</script>

</body>
</html>
