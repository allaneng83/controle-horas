<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Horas</title>
<style>
body { font-family: Arial; background:#f4f4f4; padding:20px; }
button { padding:10px; margin:10px 5px 10px 0; cursor:pointer; }
table { width:100%; background:#fff; border-collapse: collapse; }
th, td { padding:10px; border:1px solid #ccc; text-align:center; }
input { padding:6px; }
#saldoGeral { font-size:22px; font-weight:bold; margin:15px 0; }
</style>
</head>
<body>

<h2>Controle de Horas</h2>
<div id="saldoGeral">Saldo geral: 0 min</div>

<button onclick="addRow()">Adicionar Dia</button>
<button onclick="limparTudo()">Limpar Tudo</button>

<table id="table">
<tr>
<th>Data</th>
<th>Entrada</th>
<th>Saída Almoço</th>
<th>Retorno</th>
<th>Saída Final</th>
<th>Horas</th>
<th>Saldo</th>
<th>Ação</th>
</tr>
</table>

<script>
const jornada = 480;
const STORAGE_KEY = "controle_horas_dados";

let registros = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

function salvar() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(registros));
}

function hoje() {
  return new Date().toISOString().slice(0, 10);
}

function novoRegistro() {
  return {
    data: hoje(),
    entrada: "07:30",
    saidaAlmoco: "11:30",
    retorno: "12:30",
    saidaFinal: "17:30"
  };
}

function addRow(reg = novoRegistro()) {
  registros.push(reg);
  salvar();
  renderizar();
}

function remover(index) {
  registros.splice(index, 1);
  salvar();
  renderizar();
}

function limparTudo() {
  if (!confirm("Apagar todos os registros?")) return;
  registros = [];
  salvar();
  renderizar();
}

function paraMinutos(hora) {
  const [h, m] = hora.split(":").map(Number);
  return h * 60 + m;
}

function calcular(reg) {
  const entrada = paraMinutos(reg.entrada);
  const saidaAlmoco = paraMinutos(reg.saidaAlmoco);
  const retorno = paraMinutos(reg.retorno);
  const saidaFinal = paraMinutos(reg.saidaFinal);

  const total = (saidaAlmoco - entrada) + (saidaFinal - retorno);
  const diff = total - jornada;

  let saldo = 0;

  if (total >= 470 && total <= 490) {
    saldo = 0;
  } else if (diff > 60) {
    saldo = 60;
  } else {
    saldo = diff;
  }

  return { total, saldo };
}

function formatarHoras(min) {
  const h = Math.floor(Math.abs(min) / 60);
  const m = Math.abs(min) % 60;
  return `${h}h${String(m).padStart(2, "0")}`;
}

function renderizar() {
  const table = document.getElementById("table");

  table.innerHTML = `
    <tr>
      <th>Data</th>
      <th>Entrada</th>
      <th>Saída Almoço</th>
      <th>Retorno</th>
      <th>Saída Final</th>
      <th>Horas</th>
      <th>Saldo</th>
      <th>Ação</th>
    </tr>
  `;

  let saldoGeral = 0;

  registros.forEach((reg, index) => {
    const { total, saldo } = calcular(reg);
    saldoGeral += saldo;

    const row = table.insertRow();

    row.innerHTML = `
      <td><input type="date" value="${reg.data}" onchange="atualizar(${index}, 'data', this.value)"></td>
      <td><input type="time" value="${reg.entrada}" onchange="atualizar(${index}, 'entrada', this.value)"></td>
      <td><input type="time" value="${reg.saidaAlmoco}" onchange="atualizar(${index}, 'saidaAlmoco', this.value)"></td>
      <td><input type="time" value="${reg.retorno}" onchange="atualizar(${index}, 'retorno', this.value)"></td>
      <td><input type="time" value="${reg.saidaFinal}" onchange="atualizar(${index}, 'saidaFinal', this.value)"></td>
      <td>${formatarHoras(total)}</td>
      <td>${saldo > 0 ? "+" : ""}${saldo} min</td>
      <td><button onclick="remover(${index})">Excluir</button></td>
    `;
  });

  document.getElementById("saldoGeral").innerText =
    `Saldo geral: ${saldoGeral > 0 ? "+" : ""}${saldoGeral} min`;
}

function atualizar(index, campo, valor) {
  registros[index][campo] = valor;
  salvar();
  renderizar();
}

if (registros.length === 0) {
  registros.push(novoRegistro());
  salvar();
}

renderizar();
</script>

</body>
</html>
