<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Horas</title>

<style>
body { font-family: Arial; background:#f4f4f4; padding:20px; }
button { padding:10px; margin:5px; cursor:pointer; border-radius:8px; border:0; background:#111827; color:white; font-weight:bold;}
button.danger { background:#dc2626; }
table { width:100%; background:#fff; border-collapse: collapse; margin-top:10px; }
th, td { padding:8px; border:1px solid #ccc; text-align:center; }
input, select { padding:5px; width:100%; }
.pos { color:green; font-weight:bold; }
.neg { color:red; font-weight:bold; }
</style>

</head>
<body>

<h2>Controle de Horas</h2>

<p><strong>Saldo geral:</strong> <span id="saldoGeral">+00:00</span></p>

<button onclick="addRow()">Adicionar Dia</button>
<button onclick="baterPonto()">Bater ponto</button>
<button class="danger" onclick="limpar()">Limpar tudo</button>

<table id="tabela">
<tr>
<th>Data</th>
<th>Entrada</th>
<th>Saída almoço</th>
<th>Retorno</th>
<th>Saída final</th>
<th>Trabalhadas</th>
<th>Abono</th>
<th>Horas abonadas</th>
<th>Saldo</th>
<th>Ação</th>
</tr>
</table>

<script>

const jornada = 480;
const STORAGE = "controle_horas_ok";

let registros = JSON.parse(localStorage.getItem(STORAGE)) || [];

function salvar(){
  localStorage.setItem(STORAGE, JSON.stringify(registros));
}

function hoje(){
  return new Date().toISOString().slice(0,10);
}

function horaAgora(){
  let d = new Date();
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}

function paraMin(h){
  if(!h) return null;
  let [hh,mm] = h.split(":");
  return (+hh)*60 + (+mm);
}

function fmt(min){
  if(min==null) return "-";
  let h = Math.floor(Math.abs(min)/60);
  let m = Math.abs(min)%60;
  return (min<0?"-":"+") + String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
}

function calcular(reg){
  if(reg.tipoAbono=="integral") return 0;

  let e=paraMin(reg.entrada);
  let s1=paraMin(reg.saidaAlmoco);
  let r=paraMin(reg.retorno);
  let s2=paraMin(reg.saidaFinal);

  if([e,s1,r,s2].includes(null)) return null;

  let total = (s1-e)+(s2-r);

  if(reg.tipoAbono=="parcial"){
    total += paraMin(reg.horasAbonadas)||0;
  }

  let diff = total - jornada;

  if(Math.abs(diff)<=10) return 0;
  if(diff>60) return 60;

  return diff;
}

function addRow(){
  registros.push({
    id: Date.now(),
    data: hoje(),
    entrada:"",
    saidaAlmoco:"",
    retorno:"",
    saidaFinal:"",
    tipoAbono:"nenhum",
    horasAbonadas:"00:00"
  });
  salvar();
  render();
}

function remover(id){
  registros = registros.filter(r=>r.id!=id);
  salvar();
  render();
}

function limpar(){
  if(!confirm("Apagar tudo?")) return;
  registros=[];
  salvar();
  render();
}

function atualizar(id,campo,valor){
  registros = registros.map(r=>{
    if(r.id==id) r[campo]=valor;
    return r;
  });
  salvar();
  render();
}

function baterPonto(){
  let reg = registros.find(r=>r.data==hoje());

  if(!reg){
    reg = {id:Date.now(),data:hoje(),entrada:"",saidaAlmoco:"",retorno:"",saidaFinal:"",tipoAbono:"nenhum",horasAbonadas:"00:00"};
    registros.push(reg);
  }

  let h = horaAgora();

  if(!reg.entrada) reg.entrada=h;
  else if(!reg.saidaAlmoco) reg.saidaAlmoco=h;
  else if(!reg.retorno) reg.retorno=h;
  else if(!reg.saidaFinal) reg.saidaFinal=h;
  else alert("Já completou o dia");

  salvar();
  render();
}

function render(){

  let tabela = document.getElementById("tabela");
  tabela.innerHTML = tabela.rows[0].outerHTML;

  let saldoGeral = 0;

  registros.forEach(reg=>{

    let saldo = calcular(reg);
    if(saldo!=null) saldoGeral+=saldo;

    let tr = tabela.insertRow();

    tr.innerHTML = `
<td><input type="date" value="${reg.data}" onchange="atualizar(${reg.id},'data',this.value)"></td>
<td><input type="time" value="${reg.entrada}" onchange="atualizar(${reg.id},'entrada',this.value)"></td>
<td><input type="time" value="${reg.saidaAlmoco}" onchange="atualizar(${reg.id},'saidaAlmoco',this.value)"></td>
<td><input type="time" value="${reg.retorno}" onchange="atualizar(${reg.id},'retorno',this.value)"></td>
<td><input type="time" value="${reg.saidaFinal}" onchange="atualizar(${reg.id},'saidaFinal',this.value)"></td>
<td>-</td>
<td>
<select onchange="atualizar(${reg.id},'tipoAbono',this.value)">
<option value="nenhum">Sem</option>
<option value="integral">Abonado</option>
<option value="parcial">Parcial</option>
</select>
</td>
<td><input type="time" value="${reg.horasAbonadas}" onchange="atualizar(${reg.id},'horasAbonadas',this.value)"></td>
<td class="${saldo>0?'pos':saldo<0?'neg':''}">${fmt(saldo)}</td>
<td><button onclick="remover(${reg.id})">X</button></td>
`;
  });

  document.getElementById("saldoGeral").innerText = fmt(saldoGeral);
}

render();

</script>

</body>
</html>
